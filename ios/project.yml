name: Ember
options:
  bundleIdPrefix: com.ember
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

packages:
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    majorVersion: 8.0.0
  Lottie:
    url: https://github.com/airbnb/lottie-ios
    majorVersion: 4.0.0
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    majorVersion: 2.0.0

targets:
  Ember:
    type: application
    platform: iOS
    sources:
      - path: Ember
        excludes:
          - "**/.DS_Store"
    resources:
      - path: Ember/Resources/Assets.xcassets
      - path: Ember/Resources/LaunchScreen.storyboard
    dependencies:
      - package: Kingfisher
      - package: Lottie
      - package: MarkdownUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ember.app
        INFOPLIST_KEY_CFBundleDisplayName: Ember

  EmberTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EmberTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: Ember
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ember.app.tests
